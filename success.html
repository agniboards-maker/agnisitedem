<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test payment complete · Agni Boards</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FAF5EE; color: #5C2A10; font-family: 'DM Sans', system-ui, sans-serif; padding: 2rem 1rem; }
    main { max-width: 480px; text-align: center; }
    h1 { font-size: 2rem; font-weight: 600; margin: 0 0 .75rem; }
    p { line-height: 1.7; color: rgba(28,12,4,.8); }
    code { font-size: .8rem; word-break: break-all; }
    a { color: #5C2A10; border-bottom: 1px solid rgba(92,42,16,.3); }
    a:hover { color: #E8621A; }
  </style>
</head>
<body>
  <main>
    <h1>Test payment complete</h1>
    <p>This was a Stripe test-mode payment. No real money was charged.</p>
    <p id="session" hidden>Session: <code></code></p>
    <p><a href="/">Back to the main page</a></p>
  </main>
  <script>
    // Show the Checkout Session ID that Stripe put in the URL (test data only)
    var id = new URLSearchParams(window.location.search).get('session_id');
    if (id) {
      var el = document.getElementById('session');
      el.querySelector('code').textContent = id;
      el.hidden = false;
    }
  </script>
</body>
</html>
